openapi: 3.0.1
info:
  title: Framedrop Upload API
  description: API para upload e gerenciamento de vídeos.
  version: 1.0.0
x-amazon-apigateway-request-validators:
  all:
    validateRequestBody: true
    validateRequestParameters: true
  params-only:
    validateRequestBody: false
    validateRequestParameters: true
tags:
  - name: Upload
  - name: Auth
  - name: Videos
  - name: StatusVideo
paths:
  /api/uploads:
    post:
      tags:
        - Upload
      summary: Realizar upload de vídeo
      operationId: uploadVideo
      security:
        - LambdaAuthorizer: []
      x-amazon-apigateway-request-validator: all
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Upload'
      responses:
        '200':
          description: Vídeo enviado para processamento com sucesso.
          content:
            text/plain:
              schema:
                type: string
                example: Video was sent to processing
        '400':
          description: Requisição inválida (arquivo não fornecido ou vazio).
          content:
            text/plain:
              schema:
                type: string
                example: No file provided
        '401':
          description: Não autorizado.
        '500':
          description: Erro interno do servidor.
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        uri: 'http://${alb_dns_name}/api/uploads'
        passthroughBehavior: when_no_match
  '/api/videos/users/{id}':
    get:
      tags:
        - Videos
      summary: Listar vídeos por Usuário
      operationId: getVideosByUserId
      security:
        - LambdaAuthorizer: []
      x-amazon-apigateway-request-validator: params-only
      parameters:
        - name: id
          in: path
          description: ID do usuário
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de vídeos retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Video'
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        uri: 'http://${alb_dns_name}/api/videos/users/{id}'
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.path.id: method.request.path.id
  '/api/videos/{id}':
    patch:
      tags:
        - StatusVideo
      summary: Atualizar status do vídeo
      operationId: updateVideoStatus
      security:
        - LambdaAuthorizer: []
      x-amazon-apigateway-request-validator: all
      parameters:
        - name: id
          in: path
          description: ID do vídeo (videoId)
          required: true
          schema:
            type: string
      requestBody:
        description: Novo status do vídeo.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoStatus'
      responses:
        '200':
          description: Status atualizado com sucesso.
          content:
            text/plain:
              schema:
                type: string
                example: Video status updated
        '400':
          description: Dados de entrada inválidos.
        '404':
          description: Vídeo não encontrado.
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PATCH
        uri: 'http://${alb_dns_name}/api/videos/{id}'
        passthroughBehavior: when_no_match
        requestParameters:
          integration.request.path.id: method.request.path.id
components:
  schemas:
    Upload:
      type: object
      properties:
        videoFile:
          type: string
          format: binary
          description: O arquivo de vídeo a ser processado.
        required:
          - videoFile
    VideoStatus:
      type: object
      description: DTO para atualização de status.
      properties:
        status:
          type: string
          description: Novo status a ser aplicado.
          example: COMPLETED
        required:
          - status
    Video:
      type: object
      description: Objeto de transferência de dados contendo detalhes do vídeo.
      properties:
        videoId:
          type: string
          description: Identificador único do vídeo.
        userId:
          type: string
          description: Identificador do usuário proprietário.
        userName:
          type: string
          description: Nome do usuário.
        videoPath:
          type: string
          description: Caminho ou URL de armazenamento do vídeo.
        fileName:
          type: string
          description: Nome original do arquivo.
        fileExtension:
          type: string
          description: Extensão do arquivo (ex. .mp4).
        dateUploaded:
          type: string
          format: date-time
          description: Data e hora do upload (ISO 8601).
          example: '2023-10-27T14:30:00Z'
        statusProcess:
          type: string
          description: Status atual do processamento (Enum StatusProcess).
          example: PENDING
          enum:
            - PENDING
            - PROCESSING
            - COMPLETED
            - FAILED
  securitySchemes:
    LambdaAuthorizer:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: custom
      x-amazon-apigateway-authorizer:
        type: token
        authorizerUri: '${authorizer_lambda_invoke_arn}'
        identitySource: method.request.header.Authorization
